<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
.pregunta {
    font-size: 22px;
    margin-bottom: 20px;
    font-weight: bold;
    text-align: left;
    word-break: break-word; /* Evita que las palabras se salgan del contenedor */
        }
        .opcion {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.3s;
        }
        .opcion:hover {
            background-color: #0056b3;
        }
        .correcta { background-color: green !important; }
        .incorrecta { background-color: red !important; }
        .correcta-respuesta { background-color: darkgreen !important; }
        .info { margin-top: 20px; font-size: 18px; display: flex; justify-content: space-between; }
        .mensaje-final { font-size: 28px; font-weight: bold; color: darkgreen; text-align: center; margin-top: 30px; }
        .pantalla-inicial { text-align: center; }
        .boton {
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-empezar { background: #28a745; color: white; }
        .btn-reiniciar { background: #17a2b8; color: white; }
        .btn-finalizar { background: #dc3545; color: white; }
        .btn-empezar:hover { background: #218838; }
        .btn-reiniciar:hover { background: #138496; }
        .btn-finalizar:hover { background: #c82333; }
        .errores-container {
            display: none;
            margin-top: 30px;
            text-align: left;
        }
        .errores-container h2 { color: red; }
        .error-item { margin-bottom: 25px; }
        .separador {
            margin: 20px 0;
            border-top: 2px solid #ccc;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="pantalla-inicial" class="pantalla-inicial">
            <h1>Bienvenida a tu examen</h1>
            <p>Este examen tiene 25 preguntas aleatorias. Debes tener **menos de 11 fallos** para aprobar.</p>
            <p><strong>Mucha suerte, cariño ❤️</strong></p>
            <button class="boton btn-empezar" onclick="iniciarExamen()">Empezar</button>
        </div>
        <div id="examen" style="display: none;">
            <div id="pregunta" class="pregunta"></div>
            <div id="opciones"></div>
            <div class="info">
                <span>Pregunta <span id="actual">1</span>/25</span>
                <span>Aciertos: <span id="aciertos">0</span> | Fallos: <span id="fallos">0</span></span>
            </div>
            <!-- Botón de finalizar examen agregado -->
            <button id="btn-finalizar" class="boton btn-finalizar" onclick="finalizarExamen()">Finalizar Examen</button>
        </div>
        <div id="mensaje-final" class="mensaje-final" style="display: none;"></div>
        <div id="errores-container" class="errores-container"></div>
        <button id="btn-reiniciar" class="boton btn-reiniciar" style="display: none;" onclick="reiniciarExamen()">Reiniciar Examen</button>
    </div>
    <script>
         let preguntas = [
{ texto: "¿A cuál de estas organizaciones internacionales pertenece España?", opciones: ["A la Organización de Naciones Unidas (ONU)", "Al Mercado Común del Sur (MERCOSUR).", "A la unión económica Euroasiatica (UEE)"], correcta: 0 },
{ texto: "El suministro de agua y el alumbrado de las ciudades es competencia de…", opciones: ["El Ayuntamiento.", "El Gobierno autonómico.", "El Ministerio de Obras Públicas y Urbanismo."], correcta: 0 },
{ texto: "Quién fue el primer presidente del Gobierno de España en democracia ?", opciones: [" Mariano Rajoy.", "Adolfo Suárez.", "José Luis Rodríguez Zapatero."], correcta: 1 },
{ texto: "El Tribunal de Cuentas depende de... ", opciones: ["La presencia del gobierno.", "Las Cortes Generales.", "El Ministerio de Hacienda ."], correcta: 1 },
{ texto: "Cuál de estas fuerzas de seguridad es de ámbito autonómico ?", opciones: ["Policía floral de Navarra.", "Guardia Civil.", "Policía Local."], correcta: 0 },
{ texto: "Quién puede reinar en España ?", opciones: ["Solo los hombres.", "Solo las mujeres.", "Tanto los hombres como las mujeres ."], correcta: 2 },
{ texto: "Cuántas mujeres han sido presidentas del Gobierno en España ?", opciones: ["Ninguna.", "Una.", "Dos."], correcta: 0 },
{ texto: "Qué ciudad tiene más habitantes ?", opciones: ["Sevilla.", "Barcelona.", "Zaragoza."], correcta: 1 },
{ texto: "Cómo se llama el órgano de gobierno de los jueces y magistrados ?", opciones: ["Tribunal Supremo.", "Consejo General del Poder Judicial.", "Consejo de Estado."], correcta: 1 },
{ texto: "Cuántas comunidades autónomas tienen su propia bandera ?", opciones: ["Ninguna.", "Todas.", "Las que tienen una lengua cooficial."], correcta: 1 },
{ texto: "Quién es la tercera autoridad del Estado después del Rey y el presidente del Gobierno ?", opciones: ["El Presidente del Senado.", "El ministro de Economía.", "El Presidente del Congreso de los Diputados. "], correcta: 2 },
{ texto: "Cómo se aprobó la Constitución ?", opciones: ["Por el Rey.", "En referéndum.", "Lo mandó el Rey."], correcta: 1 },
{ texto: "Quién vigila el tráfico en las carreteras ?", opciones: ["La Guardia Civil.", "La Policía Nacional.", "El Ejército de Tierra."], correcta: 0 },
{ texto: "Cómo se llama la organización que defiende los intereses de los trabajadores ?", opciones: ["Asociación.", "Partido.", "Sindicato. "], correcta: 2 },
{ texto: "Quién se encarga de recaudar los impuestos ?", opciones: ["El Tribunal de Cuentas.", "Agencia Tributaria.", "El Consejo Económico y Social."], correcta: 1 },
{ texto: "Quién dirige la política interior y exterior de España ?", opciones: ["El rey.", "El gobierno.", "El Congreso de los Diputados. "], correcta: 1 },
{ texto: "La Constitución Española es…?", opciones: ["Una ley fundamental.", "Parte de otra ley.", "Una ley secundaria. "], correcta: 0 },
{ texto: "Dónde se encuentra toda la información sobre novedades e iniciativas de la Administración Electrónica", opciones: ["El INE (Instituto Nacional de Estadística).", "El BOE (Boletín Oficial del Estado)", "El PAE portal de administración electrónica. "], correcta: 2 },
{ texto: "Con qué rey se restaura la democracia España después del régimen de Franco ?", opciones: ["Carlos III.", "Alfonso XIII.", "Juan Carlos I."], correcta: 2 },
{ texto: "La Constitución garantiza el derecho de los españoles a una vivienda digna.", opciones: ["Verdadero.", "Falso.", "--------------------------------------------"], correcta: 0 },
{ texto: "La ley limita el acceso de terceras personas a datos de carácter personal.", opciones: ["Verdadero.", "Falso.", "--------------------------------------------"], correcta: 0 },
{ texto: "En España las causas de separación y divorcio están reguladas por la ley.", opciones: ["Verdadero.", "Falso.", "--------------------------------------------"], correcta: 0 },
{ texto: "España se divide en…", opciones: ["Departamentos y regiones.", "Comunidades y ciudades autonómicas.", "Regiones autónomas y distritos."], correcta: 1 },
{ texto: "Canarias tiene un clima…", opciones: ["Mediterráneo.", "Oceánico.", "Subtropical."], correcta: 2 },
{ texto: "Las chirigotas de Cádiz son típicas de…", opciones: ["la Semana Santa.", "Los Carnavales.", "Las verbenas de verano."], correcta: 1 },
{ texto: "Cómo se llama la mayor institución pública dedicada a la investigación en España ?", opciones: ["Real Academia Española (RAE).", "Consejo Superior de Investigaciones Científicas (CSIC).", "la Sociedad General de Autores (SGAE)."], correcta: 1 },
{ texto: "Teresa Perales y Daniel Molina son…", opciones: ["Campeones Paraolímpicos.", "Músicos famosos.", "Artistas de cine."], correcta: 0 },
{ texto: "Como se llama los principales trenes de alta velocidad ?", opciones: ["AVE.", "TGV.", "Eurostar."], correcta: 0 },
{ texto: "Para cuantos años vale la tarjeta sanitaria europea ?", opciones: ["Un año.", "Diez años.", "Dos años."], correcta: 2 },
{ texto: "Cual es un periódico deportivo ?", opciones: ["ABC.", "As.", "Cinco días."], correcta: 1 },
{ texto: "Cual es la edad minina para conducir un coche en España ?", opciones: ["16 años.", "18 años.", "20 años."], correcta: 1 },
{ texto: "Cuando empieza el calendario escolar ?", opciones: ["En agosto.", "En Septiembre.", "En octubre."], correcta: 1 },
{ texto: "Como se llama la ley laboral más importante de España ?", opciones: ["La Constitución.", "El Estatuto de los Trabajadores.", "El Servicio Público de Empleo Estatal."], correcta: 1 },
{ texto: "Donde se hace el pasaporte ?", opciones: ["El Registro Civil.", "Una comisaría de policía", "El ayuntamiento."], correcta: 1 },
{ texto: "Cual es el organo de gobierno en los municipios ?", opciones: ["El Ayuntamineto.", "La Diputación.", "El Cabildo."], correcta: 0 },
{ texto: "En que año se aprobo la Constitución española ?", opciones: ["1957", "1978", "2001"], correcta: 1 },
{ texto: "Cuantos millones de habitantes tiene España ?", opciones: ["48 millones", "35 millones", "62 millones"], correcta: 0 },
{ texto: "Cuantos partidos políticos hay en España ?", opciones: ["Ninguno.", "Uno.", "Muchos."], correcta: 2 },
{ texto: "El castellano o español la lengua oficial en …", opciones: ["En toda España.", "Solo donde no hay otras lenguas.", "En toda la Peninsula Ibérica."], correcta: 0 },
{ texto: "Cual es el numero de telefono de informacion de la Administración General del Estado ?", opciones: ["010.", "060.", "091."], correcta: 1 },
{ texto: "La defensa de la integridad territorial de Expaña corresponde a …", opciones: ["La Policía Nacional y la Guardia Civil.", "Las Fuerzas Armadas.", "La Policía Nacional y las policías autonómicos."], correcta: 1 },
{ texto: "Quienes forman parte del Gobierno de la nación ?", opciones: ["Los ministros.", "Los concejales.", "Los alcaldes."], correcta: 0 },
{ texto: "Se puede limitar a una persona el derecho a entrar y salir libremente de España por motivos ideológicos.", opciones: ["verdadero.", "Falso.", "-----------------------"], correcta: 1 },
{ texto: "Los jovenes tienen derecho a participar en el desarrollo político del país.", opciones: ["Verdadero.", "Falso.", "-----------------------"], correcta: 0 },
{ texto: "Todos los ciudadanos tendrán acceso al sistema de Seguridad Social Público, excepto si estan desempleados.", opciones: ["Verdadero.", "Falso.", "-----------------------"], correcta: 1 },
{ texto: "Cual de estos ríos desemboca en el océano Atlántico ?", opciones: ["El Guadalquivir.", "El Manzanares.", "El Júcar."], correcta: 0 },
{ texto: "El 6 de diciembre se celebra en España…", opciones: ["El Día de la Constitución.", "La llegada de Colón a América.", "El Día del libro."], correcta: 0 },
{ texto: "La liga y la Copa del Rey son competiciones de…", opciones: ["Natación.", "Atletísmo.", "Fútbol."], correcta: 2 },
{ texto: "El premio Cervantes se da a…", opciones: ["Actores.", "Escritores.", "Pintores."], correcta: 1 },
{ texto: "Con cuantos hijos una família es numerosa ?", opciones: ["Con 1 hijo.", "Con 2 hijos.", "Con 3 hijos."], correcta: 2 },
{ texto: "El Bachillerato en España…", opciones: ["Es obligatorio.", "Se compone de dos cursos académicos.", "Es la enseñanza a alumnos de 14 a 16 años."], correcta: 1 },
{ texto: "Cual es el horario de los hipermercados y los centros comerciales ?", opciones: ["9:00 a 17:00", "10:00 a 22:00", "8:30 a 23:00"], correcta: 1 },
{ texto: "Los principalñes ingredientes de la tortilla española son huevos y…", opciones: ["Pimientos.", "Patatas.", "Tomates."], correcta: 1 },
{ texto: "Que significa Renfe ?", opciones: ["Red Nacional de Fondos Europeos.", "Red Nacional de los Ferrocarriles Españoles.", "Red Nacional de Fundaciones Estatales."], correcta: 1 },
{ texto: "Que tipos de impuestos tienen que pagar los ciudadanos en España ?", opciones: ["Impuestos directos como el IRPF.", "Impuestos indirectos como el IVA.", "Impuestos directos e indirectos."], correcta: 2 },
{ texto: "A que hora se cena normalmente en España ?", opciones: ["A las 18 h.", "A las 23 h.", "A las 21 o 22 h."], correcta: 2 },
{ texto: "Quien controla la gestion financiera del Estado ?", opciones: ["El Banco de España.", "La Agencia Tributaria.", "El Tribunal de cuentas."], correcta: 2 },
{ texto: "El congreso de los Diputados y el Senado constituyen el  poder…", opciones: ["Ejecutivo.", "Legislativo.", "Judicial."], correcta: 1 },
{ texto: "Donde tiene lugar la investidura del presidente del Gobierno ?", opciones: ["En el Palacio de la Moncloa.", "En el Congreso de los Diputados.", "En el Senado."], correcta: 1 },
{ texto: "Que lengua es oficial en el País Vasco ?", opciones: ["El Bable.", "El Aragonés.", "El Euskera."], correcta: 2 },
{ texto: "Cuantas religiones oficiales hay en España ?", opciones: ["Ninguna.", "Una.", "Dos."], correcta: 0 },
{ texto: "Cual de estos es un órgano consultivo del Gobierno de España ?", opciones: ["El Parlamento Europeo.", "El Consejo del Estado.", "El Tribunal Constitucional."], correcta: 1 },
{ texto: "Donde vive el presidente del Gobierno ?", opciones: ["Palacio Real.", "Palacio de la Zarzuela.", "Palacio de la Moncloa."], correcta: 2 },
        ];

        function mezclarArray(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        let preguntasActuales = [];
        let indexPregunta = 0;
        let aciertos = 0;
        let errores = 0;
        let erroresLista = [];

        function iniciarExamen() {
            document.getElementById("pantalla-inicial").style.display = "none";
            document.getElementById("examen").style.display = "block";
            preguntasActuales = mezclarArray([...preguntas]).slice(0, 25);
            indexPregunta = 0;
            aciertos = 0;
            errores = 0;
            erroresLista = [];
            mostrarPregunta();
        }

        function mostrarPregunta() {
            if (indexPregunta >= preguntasActuales.length) {
                mostrarMensajeFinal();
                return;
            }
            document.getElementById("actual").textContent = indexPregunta + 1;
            document.getElementById("aciertos").textContent = aciertos;
            document.getElementById("fallos").textContent = errores;
            const pregunta = preguntasActuales[indexPregunta];
            document.getElementById("pregunta").textContent = pregunta.texto;
            const opcionesDiv = document.getElementById("opciones");
            opcionesDiv.innerHTML = "";
            pregunta.opciones.forEach((opcion, i) => {
                const boton = document.createElement("button");
                boton.textContent = opcion;
                boton.classList.add("opcion");
                boton.onclick = () => evaluarRespuesta(i, boton);
                opcionesDiv.appendChild(boton);
            });
        }

        function evaluarRespuesta(seleccion, boton) {
            const pregunta = preguntasActuales[indexPregunta];
            if (seleccion === pregunta.correcta) {
                aciertos++;
                boton.classList.add("correcta");
            } else {
                errores++;
                boton.classList.add("incorrecta");
                erroresLista.push({
                    pregunta: pregunta.texto,
                    respuestaSeleccionada: pregunta.opciones[seleccion],
                    respuestaCorrecta: pregunta.opciones[pregunta.correcta]
                });
                document.getElementById("opciones").children[pregunta.correcta].classList.add("correcta-respuesta");
            }
            setTimeout(() => { indexPregunta++; mostrarPregunta(); }, 3000);
        }

        // Función para finalizar el examen manualmente
        function finalizarExamen() {
            mostrarMensajeFinal();
        }

        function mostrarMensajeFinal() {
            document.getElementById("btn-finalizar").style.display = "none"; // Ocultar el botón de finalizar
            let erroresDiv = document.getElementById("errores-container");
            if (erroresLista.length > 0) {
                erroresDiv.innerHTML = "<h2>Preguntas incorrectas:</h2>" + erroresLista.map(error => 
                    `<div class="error-item">
                        <p><strong>Pregunta:</strong> ${error.pregunta}</p>
                        <p><strong>Tu respuesta:</strong> ${error.respuestaSeleccionada}</p>
                        <p><strong>Respuesta correcta:</strong> ${error.respuestaCorrecta}</p>
                        <div class="separador"></div>
                    </div>`).join("");
                erroresDiv.style.display = "block";
            }
            document.getElementById("mensaje-final").textContent = errores <= 10 ? "¡Felicidades, has aprobado!" : "Lo siento, has reprobado.";
            document.getElementById("btn-reiniciar").style.display = "block";
        }

        function reiniciarExamen() {
            location.reload();
        }
    </script>
</body>
</html>
